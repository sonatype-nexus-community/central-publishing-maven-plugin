# Tier 1 of the Community "Pull Request CI & Secrets" standard.
#
# Runs on every pull request, including those from forks, with NO secrets. It runs the
# contributor's code, so it must never be given a secret or a write permission.
#
# The workflow name ("CI") is referenced by lifecycle-evaluate.yaml. Keep the two in step.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# No permissions by default. Each job asks only for what it needs.
permissions: {}

jobs:
  build-and-test:
    name: Build and test (Maven ${{ matrix.maven }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # Report every supported Maven version, not just the first to fail.
      fail-fast: false
      matrix:
        # The supported Maven versions. Add a version here to support it; remove one to drop support.
        maven: ['3.9.16', '3.10.0']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The plugin is compiled at Java source level 8 (see pom.xml), and must stay buildable
      # with a Java 8 toolchain, so Java 8 is what we build and test with.
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Set up Maven ${{ matrix.maven }}
        env:
          MAVEN_VERSION: ${{ matrix.maven }}
        run: |
          set -euo pipefail
          base="https://repo1.maven.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}"
          archive="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" "${base}/${archive}"
          # Verify against the checksum Maven Central publishes alongside the archive.
          echo "$(curl -fsSL "${base}/${archive}.sha512")  ${RUNNER_TEMP}/${archive}" | sha512sum --check -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Show versions
        run: mvn --version

      # Unit tests. None of them need a protected resource.
      - name: Build and unit test
        run: mvn --batch-mode --no-transfer-progress verify

  # Integration tests that use the invoker plugin and a mock Central Portal in a container.
  # The mock needs no licence or credentials, so these are unprotected and belong in Tier 1.
  # They run on every supported Maven version and are part of the `ci` gate below.
  integration-test:
    name: Integration tests (Maven ${{ matrix.maven }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The supported Maven versions. Keep in step with build-and-test.
        maven: ['3.9.16', '3.10.0']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # The integration tests run Maven themselves, with whichever Maven runs this build, so this is the Maven
      # version they are tested against.
      - name: Set up Maven ${{ matrix.maven }}
        env:
          MAVEN_VERSION: ${{ matrix.maven }}
        run: |
          set -euo pipefail
          base="https://repo1.maven.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}"
          archive="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" "${base}/${archive}"
          # Verify against the checksum Maven Central publishes alongside the archive.
          echo "$(curl -fsSL "${base}/${archive}.sha512")  ${RUNNER_TEMP}/${archive}" | sha512sum --check -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Show versions
        run: mvn --version

      # Docker is available on the runner; the run-its profile starts the mock Central container.
      - name: Run integration tests
        run: mvn --batch-mode --no-transfer-progress -DskipTests verify -P run-its

  # Produces the input for the Sonatype Lifecycle evaluation in lifecycle-evaluate.yaml.
  # For a Java project this is the built artifact plus its dependencies; see the Java ecosystem
  # guide in the standard. This job runs contributor code (the build), so it has no secrets.
  prepare-scan-input:
    name: Prepare Lifecycle scan input
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # A single build is enough here, as the scan input does not depend on the Maven version.
      - name: Set up Maven
        env:
          MAVEN_VERSION: '3.9.16'
        run: |
          set -euo pipefail
          base="https://repo1.maven.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}"
          archive="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" "${base}/${archive}"
          # Verify against the checksum Maven Central publishes alongside the archive.
          echo "$(curl -fsSL "${base}/${archive}.sha512")  ${RUNNER_TEMP}/${archive}" | sha512sum --check -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Gather scan input
        run: |
          set -euo pipefail
          mkdir scan-input
          # The plugin jar, but not the -sources jar.
          cp target/central-publishing-maven-plugin-*.jar scan-input/
          rm -f scan-input/*-sources.jar
          # The jar is thin: it does not contain its dependencies, so copy them alongside.
          # Runtime scope only, so that test-only dependencies are not evaluated.
          mvn --batch-mode --no-transfer-progress \
            org.apache.maven.plugins:maven-dependency-plugin:3.11.0:copy-dependencies \
            -DoutputDirectory=scan-input/dependencies -DincludeScope=runtime

      - name: Upload scan input
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lifecycle-scan-input
          path: scan-input/
          if-no-files-found: error
          retention-days: 3

  # The single check to require in the branch ruleset (the standard's "one Tier 1 check").
  # It fails if any job it depends on did not succeed, so jobs can be added or renamed
  # without editing the ruleset.
  ci:
    name: CI
    if: ${{ always() }}
    needs: [build-and-test, integration-test, prepare-scan-input]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $NEEDS_RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job finished with '$result'"
              exit 1
            fi
          done
