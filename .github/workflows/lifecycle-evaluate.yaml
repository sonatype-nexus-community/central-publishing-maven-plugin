# Tier 2 of the Community "Pull Request CI & Secrets" standard.
#
# Evaluates the scan input prepared by ci.yaml with Sonatype Lifecycle. This workflow HAS
# SECRETS, so it must never check out, build or run anything from a pull request. The only thing
# it takes from the pull request is the artifact, and it treats that as data.
#
# `workflow_run` always runs the copy of this file on the default branch, even for a fork pull
# request. Changes to this file take effect only once merged, and must be reviewed by a
# maintainer (it is covered by CODEOWNERS).
#
# The pull request result is ADVISORY. The authoritative evaluations run on trusted refs, in
# lifecycle-release.yaml.
name: Sonatype Lifecycle Evaluation

on:
  workflow_run:
    workflows: [CI] # must match the `name:` of ci.yaml
    types: [completed]

permissions: {}

jobs:
  evaluate:
    name: Evaluate scan input
    # Only for pull requests, and only when Tier 1 succeeded. Trusted refs are handled by
    # lifecycle-release.yaml instead.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read # download the artifact from another run
      checks: write # report the result on the pull request
    steps:
      # Show the check as in progress straight away. It is a required check, so until it completes the
      # pull request is not mergeable.
      - name: Report evaluation in progress
        id: pending
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const { data } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              // The standard requires the status named exactly "Sonatype Lifecycle / develop".
              name: 'Sonatype Lifecycle / develop',
              head_sha: process.env.HEAD_SHA,
              status: 'in_progress',
              output: {
                title: 'Evaluating',
                summary: 'The Sonatype Lifecycle evaluation is running.',
              },
            });
            core.setOutput('check-run-id', data.id);

      # There is deliberately NO actions/checkout here.
      - name: Download scan input (as data)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lifecycle-scan-input
          path: scan-input
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Sonatype Lifecycle Evaluation
        id: evaluate
        # Do not fail here, so that the result is always reported below.
        continue-on-error: true
        uses: sonatype/actions/evaluate@b1c823a70e98d3c67478cd72c0128712623455b9 # v1.14.1
        with:
          iq-server-url: ${{ vars.SONATYPE_PLATFORM_URL }}
          username: ${{ secrets.SONATYPE_LIFECYCLE_USERNAME }}
          password: ${{ secrets.SONATYPE_LIFECYCLE_PASSWORD }}
          # Chosen here, from trusted values. Never read from the artifact.
          application-id: ${{ github.event.repository.name }}
          scan-targets: ${{ vars.LIFECYCLE_SCAN_TARGETS || 'scan-input' }}
          stage: develop # Pull requests use the develop stage, see the standard

      - name: Report result on the pull request
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHECK_RUN_ID: ${{ steps.pending.outputs.check-run-id }}
          EVALUATE_OUTCOME: ${{ steps.evaluate.outcome }}
          REPORT_URL: ${{ steps.evaluate.outputs.report-url }}
        with:
          script: |
            const outcome = process.env.EVALUATE_OUTCOME;
            const passed = outcome === 'success';
            const summaries = {
              success: 'The evaluation passed.',
              skipped: 'The scan input was missing or was rejected by validation, so nothing was evaluated.',
            };
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(process.env.CHECK_RUN_ID),
              status: 'completed',
              conclusion: passed ? 'success' : 'failure',
              details_url: process.env.REPORT_URL || undefined,
              output: {
                title: passed ? 'Passed (advisory)' : 'Needs attention (advisory)',
                summary: summaries[outcome] ??
                  'The evaluation reported policy violations or did not complete. Open the report for details.',
              },
            });
